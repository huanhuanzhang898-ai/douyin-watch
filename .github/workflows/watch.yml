name: 抖音更新提醒

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分钟检查一次（GitHub 高峰期可能延迟几分钟到十几分钟）
  workflow_dispatch:          # 允许在 Actions 页面手动点“Run workflow”

permissions:
  contents: write             # 需要把 state.json 提交回仓库，记住已经提醒过的视频

concurrency:
  group: douyin-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install playwright==1.64.1

      - name: 检查更新
        env:
          DOUYIN_USERS: ${{ secrets.DOUYIN_USERS }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python douyin_watch.py

      - name: 保存状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "更新状态" && git push)

      - name: 上传失败截图（方便排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug.png
          if-no-files-found: ignore
          retention-days: 3

name: 抖音更新提醒

on:
  schedule:
    # GitHub 的定时用 UTC 时间（北京时间 = UTC + 8），高峰期可能延迟几分钟到十几分钟
    - cron: "*/10 1-7 * * 1-5"      # 交易日 9:00–15:50 每 10 分钟
    - cron: "30 0,8-23 * * 1-5"     # 交易日其他时间每小时一次
    - cron: "30 * * * 0,6"          # 周末每小时一次
  workflow_dispatch:
    inputs:
      test_latest:
        description: "测试：把每个博主最新一条视频走一遍转写和提炼（填 1 开启）"
        required: false
        default: "0"

permissions:
  contents: write             # 需要把 state.json 和文字稿提交回仓库

concurrency:
  group: douyin-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install playwright==1.64.1

      - name: 检查更新
        env:
          DOUYIN_USERS: ${{ secrets.DOUYIN_USERS }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TEST_LATEST: ${{ github.event.inputs.test_latest }}
        run: python douyin_watch.py

      - name: 保存状态和文字稿
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -d transcripts ]; then git add transcripts; fi
          git diff --cached --quiet || (git commit -m "更新状态" && git push)

      - name: 上传失败截图（方便排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug.png
          if-no-files-found: ignore
          retention-days: 3

name: 抖音更新提醒

on:
  schedule:
    # 主要靠 cron-job.org 在交易时段每 10 分钟触发；这里是每小时一次的兜底（GitHub 定时经常延迟或跳过）
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      test_latest:
        description: "测试：把每个博主最新一条视频走一遍转写和提炼（填 1 开启）"
        required: false
        default: "0"

permissions:
  contents: write             # 需要把 state.json 和文字稿提交回仓库

concurrency:
  group: douyin-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install playwright==1.64.1

      - name: 检查更新
        env:
          DOUYIN_USERS: ${{ secrets.DOUYIN_USERS }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TEST_LATEST: ${{ github.event.inputs.test_latest }}
        run: python douyin_watch.py

      - name: 保存状态和文字稿
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -d transcripts ]; then git add transcripts; fi
          git diff --cached --quiet || (git commit -m "更新状态" && (git push || (git pull --rebase && git push) || (sleep 5 && git pull --rebase && git push)))

      - name: 上传失败截图（方便排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug.png
          if-no-files-found: ignore
          retention-days: 3
